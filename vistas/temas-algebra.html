
<div class="contenedor-temas">
    <div class="contenedor-cabecera-temas" style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <button class="btn-regresar" onclick="regresarACapitulos()">← Volver a Módulos</button>
        <button class="btn-tema btn-test" style="width:auto; flex:0 0 auto; min-width:0; padding:8px 22px; margin-left:auto;" onclick="abrirTestProximamente(event)">Test</button>
    </div>

    <h2>Temas de Álgebra Compleja</h2>

    <div class="grid-temas">
        {{tarjetas_temas}}
    </div>

    <div id="pantalla-detalle-tema" class="pantalla-detalle-tema oculto"></div>
</div>

<script>
    // ============================================================
    // CONFIGURACIÓN DEL SERVIDOR RENDER
    // ============================================================

    const API_BASE = 'https://complexlab-servidor.onrender.com';

    // Convierte las rutas relativas o locales en rutas de Render.
    function obtenerUrlRender(url) {
        if (!url) return '';

        // Si la dirección ya es absoluta, sustituir localhost por Render.
        if (/^https?:\/\//i.test(url)) {
            return url.replace(
                /^https?:\/\/localhost:5000/i,
                API_BASE
            );
        }

        // Si la ruta es relativa, construirla desde Render.
        return new URL(url, API_BASE).href;
    }

    // ============================================================
    // CARGAR EXPLICACIÓN TEÓRICA
    // ============================================================

    function redirigirTema(event, idTema) {
        cargarExplicacionTeorica(idTema);
    }

    // ============================================================
    // CARGAR SIMULACIÓN DENTRO DE LA PANTALLA
    // ============================================================

    async function irASimulacionTema(event, urlSim) {
        event.stopPropagation();

        try {
            const url = obtenerUrlRender(urlSim);

            console.log('Solicitando simulación:', url);

            const res = await fetch(url);

            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }

            const datos = await res.json();

            const areaDetalle = document.getElementById('pantalla-detalle-tema');

            areaDetalle.innerHTML =
                '<div style="padding:10px 10px 0;">' +
                    '<button class="btn-regresar" onclick="regresarAlasTarjetas()">← Volver a Temas</button>' +
                '</div>' +
                datos.html;

            document.querySelector('.grid-temas').style.display = 'none';
            document.querySelector('.contenedor-temas > h2').style.display = 'none';
            document.querySelector('.contenedor-cabecera-temas').style.display = 'none';

            areaDetalle.classList.remove('oculto');

            if (window.MathJax && window.MathJax.typesetPromise) {
                await window.MathJax.typesetPromise([areaDetalle]);
            }

        } catch (error) {
            console.error('Error al cargar la simulación:', error);
            alert('No se pudo cargar la simulación.');
        }
    }

    // ============================================================
    // FUNCIÓN EXAMEN
    // ============================================================

    async function abrirTestProximamente(event) {
        event.stopPropagation();

        try {
            const respuesta = await fetch(
                obtenerUrlRender('/api/examen-algebra')
            );

            if (!respuesta.ok) {
                throw new Error('HTTP ' + respuesta.status);
            }

            const datos = await respuesta.json();

            const areaDetalle = document.getElementById('pantalla-detalle-tema');

            // Cargar CSS del examen.
            if (datos.cssUrl) {
                const cssAnterior = document.getElementById('css-examen-algebra');

                if (cssAnterior) {
                    cssAnterior.remove();
                }

                const nuevoCss = document.createElement('link');
                nuevoCss.id = 'css-examen-algebra';
                nuevoCss.rel = 'stylesheet';
                nuevoCss.href = obtenerUrlRender(datos.cssUrl);

                document.head.appendChild(nuevoCss);
            }

            if (window.MathJax && window.MathJax.typesetClear) {
                window.MathJax.typesetClear([areaDetalle]);
            }

            areaDetalle.innerHTML = datos.html;

            document.querySelector('.grid-temas').style.display = 'none';
            document.querySelector('.contenedor-temas > h2').style.display = 'none';
            document.querySelector('.contenedor-cabecera-temas').style.display = 'none';

            areaDetalle.classList.remove('oculto');

            // Procesar scripts internos y externos.
            const scriptsInternos = areaDetalle.querySelectorAll('script');

            scriptsInternos.forEach(scriptViejo => {
                const scriptNuevo = document.createElement('script');

                Array.from(scriptViejo.attributes).forEach(attr => {
                    if (attr.name === 'src') {
                        scriptNuevo.src = obtenerUrlRender(attr.value);
                    } else {
                        scriptNuevo.setAttribute(attr.name, attr.value);
                    }
                });

                if (!scriptViejo.src) {
                    scriptNuevo.textContent = scriptViejo.textContent;
                }

                scriptViejo.replaceWith(scriptNuevo);
            });

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([areaDetalle])
                    .catch(err => {
                        console.error('Error renderizando MathJax en Examen:', err);
                    });
            }

        } catch (error) {
            console.error('Error al cargar el examen:', error);
            alert('No se pudo cargar el examen de Álgebra Compleja.');
        }
    }

    // ============================================================
    // CARGAR EXPLICACIÓN TEÓRICA DE UN TEMA
    // ============================================================

    async function cargarExplicacionTeorica(idTema) {
        try {
            const url = obtenerUrlRender(
                '/api/contenido-tema/' + encodeURIComponent(idTema)
            );

            const res = await fetch(url);

            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }

            const datos = await res.json();

            const areaDetalle = document.getElementById('pantalla-detalle-tema');

            if (window.MathJax && window.MathJax.typesetClear) {
                window.MathJax.typesetClear([areaDetalle]);
            }

            areaDetalle.innerHTML = datos.html;

            document.querySelector('.grid-temas').style.display = 'none';
            document.querySelector('.contenedor-temas > h2').style.display = 'none';
            document.querySelector('.contenedor-cabecera-temas').style.display = 'none';

            areaDetalle.classList.remove('oculto');

            // Procesar scripts internos y externos.
            const scriptsInternos = areaDetalle.querySelectorAll('script');

            scriptsInternos.forEach(scriptViejo => {
                const scriptNuevo = document.createElement('script');

                Array.from(scriptViejo.attributes).forEach(attr => {
                    if (attr.name === 'src') {
                        scriptNuevo.src = obtenerUrlRender(attr.value);
                    } else {
                        scriptNuevo.setAttribute(attr.name, attr.value);
                    }
                });

                if (!scriptViejo.src) {
                    scriptNuevo.textContent = scriptViejo.textContent;
                }

                scriptViejo.replaceWith(scriptNuevo);
            });

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([areaDetalle])
                    .catch(err => {
                        console.error('Error renderizando MathJax:', err);
                    });
            }

        } catch (error) {
            console.error('Error al cargar la teoría:', error);
            alert('No se pudo cargar el contenido teórico del tema.');
        }
    }

    // ============================================================
    // REGRESAR A LAS TARJETAS DE TEMAS
    // ============================================================

    function regresarAlasTarjetas() {
        document.getElementById('pantalla-detalle-tema').classList.add('oculto');

        document.querySelector('.grid-temas').style.display = 'flex';
        document.querySelector('.contenedor-temas > h2').style.display = 'block';
        document.querySelector('.contenedor-cabecera-temas').style.display = 'flex';
    }

    // ============================================================
    // REGRESAR A LOS MÓDULOS
    // ============================================================

    function regresarACapitulos() {
        document.getElementById('btn-variable-compleja').click();
    }
</script>
